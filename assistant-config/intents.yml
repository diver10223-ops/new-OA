intents:
  - id: query_indicator
    name: 查询指标
    examples:
      - "本月本分行存款余额是多少"
      - "查询总部平均存款"
      - "现在的贷款占比是多少"
    keywords: ["查询", "多少", "当前", "余额", "平均存款", "贷款占比"]

  - id: compare_indicator
    name: 比较指标
    examples:
      - "存款余额比上期增加了多少"
      - "比较总部和分行的平均存款"
      - "贷款占比较上月有什么变化"
    keywords: ["比较", "对比", "比上期", "较上月", "增加", "减少"]

  - id: trend_indicator
    name: 趋势查询
    examples:
      - "查看近三个月存款余额趋势"
      - "平均存款最近走势如何"
      - "贷款占比的历史变化"
    keywords: ["趋势", "走势", "历史", "近三个月", "变化曲线", "时间序列"]
