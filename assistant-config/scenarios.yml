scenarios:
  - id: query_indicator_standard
    name: 指标查询-标准卡片
    intent: query_indicator
    slots: ["indicator", "org", "time"]
    domainType: analytics
    mode: standard
    skills: ["read_indicator"]
    template: indicator_card
    policies: ["org_view_policy"]

  - id: compare_indicator_standard
    name: 指标比较-标准卡片
    intent: compare_indicator
    slots: ["indicator", "org", "comparisonPeriod"]
    domainType: analytics
    mode: standard
    skills: ["compare_indicator"]
    template: comparison_result
    policies: ["org_view_policy"]

  - id: trend_indicator_standard
    name: 趋势查询-标准卡片
    intent: trend_indicator
    slots: ["indicator", "org", "timeRange"]
    domainType: analytics
    mode: standard
    skills: ["read_trend"]
    template: trend_result
    policies: ["org_view_policy"]

  - id: indicator_candidates
    name: 指标歧义-候选列表
    intent: query_indicator
    slots: ["org", "time"]
    domainType: analytics
    mode: candidate
    skills: ["list_candidates"]
    template: candidate_list
    policies: ["org_view_policy"]
