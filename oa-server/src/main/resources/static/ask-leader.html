<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>行长经营问数台 · Smart OA</title>
  <style>
    :root{--navy:#082b55;--blue:#175da8;--pale:#edf4fb;--ink:#172a3d;--muted:#65788b;--line:#dce5ee;--good:#087a55;--bad:#b43b3b;--gold:#d5a53b;--shadow:0 12px 36px rgba(8,43,85,.09)}
    *{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,textarea{font:inherit}
    header{color:#fff;background:linear-gradient(120deg,#061f3d,#0b4179);padding:28px max(24px,calc((100% - 1180px)/2));box-shadow:0 4px 20px #082b5530}.top{display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{font-size:14px;letter-spacing:.15em;color:#a9c9e9}.title{margin:3px 0 0;font-size:30px}.subtitle{margin:4px 0 0;color:#c6dbef}.badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:9px}.badge{border:1px solid #ffffff35;background:#ffffff14;padding:5px 11px;border-radius:99px;font-size:13px}.badge.api[data-state=available]{background:#087a55}.badge.api[data-state=unavailable]{background:#9e3232}.badge.api[data-state=checking]{background:#745c1c}
    main{max-width:1180px;margin:26px auto;padding:0 20px 50px}.card{background:#fff;border:1px solid #e5ebf1;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}h2{font-size:18px;margin:0 0 14px}.question{width:100%;min-height:104px;resize:vertical;border:1px solid #cbd8e5;border-radius:10px;padding:14px;outline:none}.question:focus{border-color:var(--blue);box-shadow:0 0 0 3px #175da81c}.actions{display:flex;align-items:center;gap:10px;margin-top:12px}.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.primary{color:#fff;background:var(--blue)}.secondary{color:var(--navy);background:#e8f0f8}.link{color:var(--blue);background:transparent;padding:6px}.loading{color:var(--blue);font-weight:600}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}.quick button,.suggestion{border:1px solid #c9d8e7;border-radius:99px;background:#f8fbfe;color:#284d70;padding:7px 12px;cursor:pointer}
    .hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:25px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.summary div,.metric{background:#f6f9fc;border-radius:9px;padding:11px}.label{display:block;color:var(--muted);font-size:12px}.value{font-weight:650;overflow-wrap:anywhere}.business{margin-top:17px;border-top:1px solid var(--line);padding-top:17px}.hero-value{font-size:35px;color:var(--navy);font-weight:750}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.notice{border-left:4px solid var(--gold);background:#fff9e9;padding:13px;border-radius:5px}.notice.error{border-color:var(--bad);background:#fff2f2}.candidate-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.candidate{border:1px solid var(--line);padding:13px;border-radius:9px}.trend{display:flex;align-items:flex-end;gap:18px;height:190px;margin-top:12px;border-bottom:1px solid var(--line);padding:0 12px}.trend-point{flex:1;text-align:center}.bar{background:linear-gradient(#2b78c4,#0b4179);min-height:5px;max-height:130px;border-radius:6px 6px 0 0;margin:5px auto;width:min(72px,70%)}
    .trace-head{display:flex;justify-content:space-between}.timeline{border-left:2px solid #bdd1e5;margin:14px 0 4px 12px;padding-left:22px}.event{position:relative;margin-bottom:18px}.event:before{content:"";position:absolute;left:-29px;top:5px;width:11px;height:11px;background:var(--blue);border:3px solid #dceafa;border-radius:50%}.stage{font-weight:700}.raw{font:12px ui-monospace,monospace;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d2338;color:#dceafa;padding:14px;border-radius:8px;font:12px/1.55 ui-monospace,monospace}details{margin-top:12px}summary{cursor:pointer;font-weight:650}.debug-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.debug-grid h3{font-size:14px}.retry{margin-top:10px}
    @media(max-width:760px){header{padding:22px 18px}.top{align-items:flex-start;flex-direction:column}.badges{justify-content:flex-start}.title{font-size:24px}.summary{grid-template-columns:repeat(2,1fr)}.metrics,.candidate-list,.debug-grid{grid-template-columns:1fr}.card{padding:16px}.trend{gap:5px}.actions{flex-wrap:wrap}}
  </style>
</head>
<body>
<header><div class="top"><div><div class="brand">SMART OA</div><h1 class="title">行长经营问数台</h1><p class="subtitle">用自然语言查询总部经营指标</p></div><div class="badges"><span class="badge">当前身份：行长</span><span class="badge">当前机构：总部</span><span id="apiStatus" class="badge api" data-state="unknown">API：未检测</span></div></div></header>
<main>
  <section class="card"><h2>向经营数据提问</h2><textarea id="question" class="question" maxlength="500" placeholder="例如：总部存款余额是多少" aria-label="问题"></textarea><div class="actions"><button id="submit" class="btn primary">开始问数</button><button id="clear" class="btn secondary">清空</button><span id="requestLoading" class="loading hidden">正在查询真实后端…</span></div><div class="quick" id="quickQuestions" aria-label="行长快捷问题"></div></section>
  <section id="resultCard" class="card"><h2>问数结果</h2><div id="empty" class="empty">提交问题后，将在这里展示经营指标结果。</div><div id="resultContent" class="hidden"><div id="summary" class="summary"></div><div id="business" class="business"></div><div class="actions"><button id="traceButton" class="btn secondary hidden">查看执行轨迹</button></div></div></section>
  <section id="traceCard" class="card hidden"><div class="trace-head"><h2>执行轨迹</h2><button id="closeTrace" class="btn link">关闭</button></div><div id="traceLoading" class="loading hidden">正在加载执行轨迹…</div><div id="traceError"></div><div id="traceContent"></div><details id="rawTrace"><summary>原始 trace JSON</summary><pre id="traceJson"></pre></details></section>
  <details class="card"><summary>接口调试信息</summary><div class="debug-grid"><div><h3>Request</h3><pre id="debugRequest">尚未请求</pre></div><div><h3>Response</h3><pre id="debugResponse">尚未响应</pre></div><div><h3>Trace Response</h3><pre id="debugTrace">尚未加载</pre></div></div></details>
</main>
<script>
'use strict';
const EXECUTE_URL='/api/assistant/execute', HEALTH_URL='/api/health', USER_ID='demo_leader', ORG='HEADQUARTERS';
const questions=['总部存款余额是多少','总部平均存款比上期增加多少','总部贷款占比近三个月趋势','存款余额和平均存款是多少','今天天气怎么样'];
const indicatorNames={deposit_balance:'存款余额',avg_deposit:'平均存款',loan_deposit_ratio:'贷款占比'};
const stageNames={INPUT_RECEIVED:'接收输入',INTENT_MATCHED:'匹配意图',SLOTS_EXTRACTED:'提取槽位',SCENARIO_SELECTED:'选择场景',SKILL_EXECUTED:'执行技能',TEMPLATE_SELECTED:'选择模板',RESULT_CREATED:'生成结果'};
const el=id=>document.getElementById(id); let executeController=null,traceController=null,inFlight=false,currentResponse=null,traceCache=new Map();
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(className)n.className=className;return n}
function isObject(v){return v!==null&&typeof v==='object'&&!Array.isArray(v)} function has(o,keys){return isObject(o)&&keys.every(k=>Object.prototype.hasOwnProperty.call(o,k))}
function pretty(value){try{return JSON.stringify(value,null,2)}catch(e){return String(value)}}
function setApi(state,label){el('apiStatus').dataset.state=state;el('apiStatus').textContent='API：'+label}
async function checkHealth(){setApi('checking','检测中');try{const r=await fetch(HEALTH_URL,{headers:{Accept:'application/json'}});setApi(r.ok?'available':'unavailable',r.ok?'后端可用':'后端不可用')}catch(e){setApi('unavailable','后端不可用')}}
function addField(parent,label,value){const box=node('div');box.append(node('span',label,'label'),node('span',value??'暂无','value'));parent.append(box)}
function fillQuestion(value){el('question').value=value;el('question').focus()}
function resetForNewRequest(){if(traceController)traceController.abort();currentResponse=null;traceCache.clear();el('empty').classList.add('hidden');el('resultContent').classList.remove('hidden');el('summary').replaceChildren();el('business').replaceChildren();el('traceButton').classList.add('hidden');el('traceCard').classList.add('hidden');el('traceContent').replaceChildren();el('traceError').replaceChildren();el('traceJson').textContent='';el('debugTrace').textContent='尚未加载'}
function setBusy(busy){inFlight=busy;el('submit').disabled=busy;el('requestLoading').classList.toggle('hidden',!busy)}
function safeHeaders(headers){const output={};for(const [key,value] of headers.entries()){if(['content-type','content-length','date','cache-control','x-request-id'].includes(key.toLowerCase()))output[key]=value}return output}
function renderDebugInfo(type,data){el(type==='request'?'debugRequest':type==='response'?'debugResponse':'debugTrace').textContent=pretty(data)}
async function readResponse(response){const raw=await response.text();if(!raw)return {raw,json:null,parseError:null};try{return {raw,json:JSON.parse(raw),parseError:null}}catch(e){return {raw,json:null,parseError:e.message}}}
async function requestAssistant(){const text=el('question').value.trim();if(!text||inFlight)return;if(executeController)executeController.abort();executeController=new AbortController();resetForNewRequest();setBusy(true);const body={text,org:ORG};const started=performance.now();renderDebugInfo('request',{url:EXECUTE_URL,method:'POST',headers:{'Content-Type':'application/json','X-User-Id':USER_ID},body});
 try{const response=await fetch(EXECUTE_URL,{method:'POST',headers:{'Content-Type':'application/json','X-User-Id':USER_ID},body:JSON.stringify(body),signal:executeController.signal});const parsed=await readResponse(response),elapsed=Math.round(performance.now()-started);renderDebugInfo('response',{httpStatus:response.status,headers:safeHeaders(response.headers),body:parsed.json??parsed.raw,durationMs:elapsed});if(!response.ok){renderTransportError('HTTP 请求失败','HTTP '+response.status,parsed.json??parsed.raw,response.status,text,elapsed);return}if(parsed.parseError){renderTransportError('响应不是有效 JSON',parsed.parseError,parsed.raw,response.status,text,elapsed);return}if(!isObject(parsed.json)){renderTransportError('响应不是有效 JSON','JSON 顶层结构不是对象',parsed.raw,response.status,text,elapsed);return}currentResponse=parsed.json;renderAssistantResponse(parsed.json,{text,httpStatus:response.status,elapsed})
 }catch(error){if(error.name==='AbortError')return;const elapsed=Math.round(performance.now()-started);setApi('unavailable','后端不可用');renderDebugInfo('response',{networkError:error.message,durationMs:elapsed});renderTransportError('无法连接后端',error.message,null,'网络失败',text,elapsed)}finally{setBusy(false)}}
function renderSummary(data,meta){const s=el('summary');[['原始问题',meta.text],['当前身份','行长'],['当前机构','总部'],['业务状态',data.status??'未知'],['intent',data.intent],['scenario',data.scenario],['traceId',data.traceId],['响应耗时',meta.elapsed+' ms'],['HTTP 状态','HTTP '+meta.httpStatus]].forEach(x=>addField(s,x[0],x[1]))}
function renderAssistantResponse(data,meta){renderSummary(data,meta);const business=el('business');business.replaceChildren();switch(data.status){case'success':renderSuccessResult(data.result,business);break;case'candidate':renderCandidate(data.candidates,business);break;case'unsupported':renderUnsupported(data.suggestions,business);break;case'denied':renderDenied(business);break;case'error':renderBusinessError(data.error,business);break;default:showNotice(business,'未知业务状态','后端返回了无法识别的 status：'+String(data.status),'error')}if(typeof data.traceId==='string'&&data.traceId){el('traceButton').classList.remove('hidden')}}
function indicatorUnit(indicator,result){return typeof result.unit==='string'?result.unit:indicator==='loan_deposit_ratio'?'%':'元'}
function formatIndicatorValue(value,indicator,unit){if(value===null||value===undefined)return'暂无';if(typeof value!=='number'&&typeof value!=='string')return String(value);const n=Number(value);if(!Number.isFinite(n))return String(value);if(indicator==='loan_deposit_ratio'||unit==='%')return new Intl.NumberFormat('zh-CN',{style:'percent',maximumFractionDigits:2}).format(n);return new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2}).format(n)+(unit?' '+unit:'')}
function formatChangeRate(value){if(value===null||value===undefined)return'暂无';const n=Number(value);return Number.isFinite(n)?new Intl.NumberFormat('zh-CN',{style:'percent',minimumFractionDigits:2,maximumFractionDigits:2}).format(n):'暂无'}
function renderSuccessResult(result,parent){if(!isObject(result)){showNotice(parent,'结果数据不完整，暂时无法展示','请在接口调试信息中查看原始响应。','error');return}const indicator=result.indicator,unit=indicatorUnit(indicator,result);if(has(result,['indicator','org','trend'])&&Array.isArray(result.trend)){const head=node('div');addField(head,'指标名称',indicatorNames[indicator]||indicator);addField(head,'机构',result.org);parent.append(head);const chart=node('div',undefined,'trend');const numeric=result.trend.map(p=>isObject(p)?Number(p.value):0).filter(Number.isFinite),max=Math.max(...numeric,1);result.trend.forEach(p=>{const item=node('div',undefined,'trend-point');if(isObject(p)){item.append(node('div',formatIndicatorValue(p.value,indicator,unit),'value'));const bar=node('div',undefined,'bar');bar.style.height=Math.max(5,Number(p.value)/max*125)+'px';item.append(bar,node('div',p.period??'未知','label'))}else item.append(node('div','数据点无效'));chart.append(item)});parent.append(chart);return}if(has(result,['indicator','org','current','previous','difference','changeRate'])){addField(parent,'指标名称',indicatorNames[indicator]||indicator);const metrics=node('div',undefined,'metrics');[['本期',formatIndicatorValue(result.current,indicator,unit)],['上期',formatIndicatorValue(result.previous,indicator,unit)],['差额',formatIndicatorValue(result.difference,indicator,unit)],['变化率',formatChangeRate(result.changeRate)]].forEach(x=>addField(metrics,x[0],x[1]));parent.append(metrics);if(result.changeRateNote!==undefined)addField(parent,'变化率说明',result.changeRateNote);return}if(has(result,['indicator','org','value'])){addField(parent,'指标名称',indicatorNames[indicator]||indicator);addField(parent,'机构',result.org);const hero=node('div',formatIndicatorValue(result.value,indicator,unit),'hero-value');parent.append(node('span','当前值','label'),hero);addField(parent,'单位',unit);return}showNotice(parent,'结果数据不完整，暂时无法展示','原始 JSON 仍保留在接口调试信息中。','error')}
function showNotice(parent,title,message,type){const box=node('div',undefined,'notice '+(type||''));box.append(node('strong',title),node('div',message));parent.append(box)}
function renderCandidate(candidates,parent){parent.append(node('h3','找到多个候选指标'));const list=node('div',undefined,'candidate-list');(Array.isArray(candidates)?candidates:[]).forEach(c=>{const item=node('div',undefined,'candidate');if(isObject(c)){addField(item,'code',c.code);addField(item,'name',c.name);addField(item,'unit',c.unit)}list.append(item)});parent.append(list);showNotice(parent,'需要更明确的问题','请改写为更明确的问题后重新提交。')}
function renderUnsupported(suggestions,parent){showNotice(parent,'暂不支持这个问题','可以尝试以下建议问法。');const list=node('div',undefined,'quick');(Array.isArray(suggestions)?suggestions:[]).forEach(s=>{const b=node('button',s,'suggestion');b.type='button';b.addEventListener('click',()=>fillQuestion(String(s)));list.append(b)});parent.append(list)}
function renderDenied(parent){showNotice(parent,'当前行长身份无权查看该机构或指标','为保护经营数据，本页面不会展示响应中的任何 result 数值。','error')}
function renderBusinessError(error,parent){const e=isObject(error)?error:{};showNotice(parent,'业务处理失败','错误 code：'+String(e.code??'暂无')+'；错误 message：'+String(e.message??'暂无'),'error');const retry=node('button','重新提交','btn primary retry');retry.addEventListener('click',requestAssistant);parent.append(retry)}
function renderTransportError(title,message,payload,httpStatus,text,elapsed){renderSummary({status:'连接/协议错误',intent:'—',scenario:'—',traceId:'—'},{text,httpStatus,elapsed});showNotice(el('business'),title,message+(payload===null?'':'\n响应：'+(typeof payload==='string'?payload:pretty(payload))),'error')}
async function loadTrace(){if(!currentResponse||typeof currentResponse.traceId!=='string')return;const id=currentResponse.traceId;el('traceCard').classList.remove('hidden');if(traceCache.has(id)){renderTrace(traceCache.get(id));return}if(traceController)traceController.abort();traceController=new AbortController();el('traceLoading').classList.remove('hidden');el('traceError').replaceChildren();const url='/api/assistant/trace/'+encodeURIComponent(id);try{const response=await fetch(url,{headers:{'X-User-Id':USER_ID,Accept:'application/json'},signal:traceController.signal});const parsed=await readResponse(response);renderDebugInfo('trace',{url,httpStatus:response.status,body:parsed.json??parsed.raw});if(!response.ok)throw new Error('HTTP '+response.status+'：'+(typeof parsed.raw==='string'?parsed.raw:''));if(parsed.parseError)throw new Error('响应不是有效 JSON：'+parsed.parseError);traceCache.set(id,parsed.json);renderTrace(parsed.json)}catch(error){if(error.name!=='AbortError')showNotice(el('traceError'),'轨迹加载失败',error.message,'error')}finally{el('traceLoading').classList.add('hidden')}}
function renderTrace(trace){const content=el('traceContent');content.replaceChildren();const timeline=node('div',undefined,'timeline');(isObject(trace)&&Array.isArray(trace.stages)?trace.stages:[]).forEach(event=>{const item=node('div',undefined,'event');if(isObject(event)){const original=String(event.stage??'未知');item.append(node('div',stageNames[original]||original,'stage'),node('div','原始阶段：'+original,'raw'),node('div','时间：'+String(event.at??'暂无')),node('pre',pretty(event.details)))}timeline.append(item)});content.append(timeline);el('traceJson').textContent=pretty(trace);el('rawTrace').open=false}
function clearPage(){if(executeController)executeController.abort();if(traceController)traceController.abort();setBusy(false);el('question').value='';currentResponse=null;traceCache.clear();el('resultContent').classList.add('hidden');el('empty').classList.remove('hidden');el('traceCard').classList.add('hidden');renderDebugInfo('request','尚未请求');renderDebugInfo('response','尚未响应');renderDebugInfo('trace','尚未加载')}
questions.forEach(q=>{const b=node('button',q);b.type='button';b.addEventListener('click',()=>fillQuestion(q));el('quickQuestions').append(b)});el('submit').addEventListener('click',requestAssistant);el('clear').addEventListener('click',clearPage);el('traceButton').addEventListener('click',loadTrace);el('closeTrace').addEventListener('click',()=>el('traceCard').classList.add('hidden'));el('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();requestAssistant()}});window.addEventListener('beforeunload',()=>{if(executeController)executeController.abort();if(traceController)traceController.abort()});checkHealth();
</script>
</body>
</html>
