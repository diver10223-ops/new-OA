<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能问数管理中心</title>
<style>
:root{font-family:system-ui,sans-serif;color:#17243d;background:#eef2f8}*{box-sizing:border-box}body{margin:0}header{background:#082b5c;color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}button,input,select,textarea{font:inherit}button{border:0;border-radius:5px;padding:8px 14px;cursor:pointer}.primary{background:#1464c0;color:#fff}.danger{background:#b42318;color:#fff}.ghost{border:1px solid #b9c7da;background:white}.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}.panel{background:#fff;border-radius:8px;box-shadow:0 2px 10px #17355c18;padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{min-width:160px}.metric{border:1px solid #d8e0eb;border-radius:6px;padding:12px;margin:8px 0;cursor:pointer}.metric.active{border-color:#1464c0;background:#edf5ff}.muted{color:#66758a;font-size:13px}.badge{display:inline-block;border-radius:12px;padding:2px 8px;background:#e7edf5;font-size:12px;margin-right:4px}.dirty{background:#fff0c2;color:#7a4c00}.risk{background:#fee4e2;color:#9c1c13}.tabs{display:flex;gap:6px;border-bottom:1px solid #d8e0eb;margin-bottom:15px}.tabs button.active{background:#dcecff;color:#074c99}.grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:12px}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;padding:8px;border:1px solid #bdc8d8;border-radius:4px}.wide{grid-column:1/-1}.org{border:1px solid #d8e0eb;border-radius:6px;padding:12px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:6px 0}.status{padding:10px;border-radius:5px;background:#edf5ff;margin:8px 0;white-space:pre-wrap}.error{background:#fee4e2;color:#8a1610}.raw{width:100%;min-height:480px;font-family:monospace}.refs{width:100%;border-collapse:collapse}.refs td,.refs th{border-bottom:1px solid #d8e0eb;padding:8px;text-align:left}.hidden{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><header><div><b>智能问数管理中心</b><div class="muted" style="color:#c8d9ef">指标管理 / 指标定义</div></div><span id="saveState" class="badge">加载中</span></header>
<main class="layout"><aside class="panel"><div class="toolbar"><input id="search" placeholder="搜索编码或名称"><select id="unit"><option value="">全部单位</option></select><button id="clear" class="ghost">清除</button></div><div class="toolbar"><button id="add" class="primary">新增指标</button><button id="reload" class="ghost">重新加载</button></div><div id="list"></div></aside>
<section class="panel"><div class="toolbar"><button id="save" class="primary">保存配置</button><button id="validate" class="ghost">保存前校验</button><button id="discard" class="ghost">恢复未保存修改</button><button id="remove" class="danger">删除指标</button></div><div id="message"></div><div class="tabs"><button data-tab="structured" class="active">结构化编辑</button><button data-tab="raw">配置原文</button><button data-tab="preview">数据预览</button><button data-tab="references">引用检查</button></div><div id="content"></div></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id), state={selected:null,draft:null,original:null,checksum:'',dirty:false,validating:false,saving:false,deleting:false,tab:'structured',controller:null,rawText:'',references:[],search:'',unit:''};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function field(label,value,type='text'){const w=el('div',undefined,'field'),l=el('label',label),i=document.createElement(type==='textarea'?'textarea':'input');i.value=value??'';if(type!=='textarea')i.type=type;w.append(l,i);return[w,i]}
function token(){return localStorage.getItem('token')||localStorage.getItem('accessToken')||''}async function request(url,options={}){if(state.controller)state.controller.abort();state.controller=new AbortController();const headers={'Content-Type':'application/json'};const t=token();if(t)headers.Authorization='Bearer '+t;let response;try{response=await fetch(url,{...options,headers,signal:state.controller.signal})}catch(e){if(e.name==='AbortError')throw e;throw new Error('网络请求失败：'+e.message)}let body;try{body=await response.json()}catch(e){throw new Error('响应 JSON 解析失败（HTTP '+response.status+'）')}if(!response.ok){const messages={401:'登录状态无效或已过期。',403:'当前账号无权访问智能问数管理功能。',409:'配置已被其他操作修改，请重新加载后再保存。',500:'服务端保存失败，正式配置未被覆盖。'};throw new Error(messages[response.status]||body.message||((body.errors||[]).map(x=>x.path+': '+x.message).join('\n'))||'HTTP '+response.status)}return body}
function clone(v){return JSON.parse(JSON.stringify(v))}function parseMetricConfig(content){const value=JSON.parse(content);if(!value||!Array.isArray(value.indicators))throw new Error('indicators 必须为数组');return value}async function loadMetricDraft(force=false){if(state.dirty&&!force&&!confirm('存在未保存修改，重新加载会丢弃修改，是否继续？'))return;renderLoading();try{const d=await request('/api/admin/assistant-config/mock');state.draft=parseMetricConfig(d.content);state.original=clone(state.draft);state.checksum=d.checksum;state.rawText=d.content;state.selected=state.draft.indicators[0]?.code||null;setDirty(false);render()}catch(e){renderHttpError(e)}}
function filterMetrics(){const q=state.search.trim().toLowerCase();return state.draft.indicators.filter(m=>(!q||(m.code+' '+m.name).toLowerCase().includes(q))&&(!state.unit||m.unit===state.unit))}function renderMetricToolbar(){const select=$('unit'),old=state.unit;while(select.options.length>1)select.remove(1);[...new Set(state.draft.indicators.map(x=>x.unit))].sort().forEach(u=>{const o=el('option',u);o.value=u;select.append(o)});select.value=old}
function renderMetricList(){const box=$('list');box.replaceChildren();const list=filterMetrics();if(!list.length){box.append(el('p','没有符合条件的指标。','muted'));return}list.forEach(m=>{const card=el('div',undefined,'metric'+(m.code===state.selected?' active':''));card.append(el('b',m.name),el('div',m.code+' · '+m.unit,'muted'),el('div',(m.calculation||'').slice(0,48),'muted'));const tags=el('div');tags.append(el('span',Object.keys(m.orgData||{}).length+' 个机构','badge'),el('span',trendStatus(m),'badge'),el('span',referenceStatus(m.code),'badge'+(state.references.some(r=>r.blocksDeletion)?' risk':'')));if(state.dirty)tags.append(el('span','未保存','badge dirty'));card.append(tags,el('div',m.updatedAt,'muted'));card.addEventListener('click',()=>selectMetric(m.code));box.append(card)})}
function trendStatus(m){const orgs=Object.values(m.orgData||{});return orgs.length&&orgs.every(x=>Array.isArray(x.trend)&&x.trend.length)?'趋势完整':'趋势缺失'}function referenceStatus(code){return state.selected===code&&state.references.length?state.references.length+' 项已知关联':'待检查'}function selectMetric(code){if(state.selected!==code&&state.dirty&&!confirm('当前配置有未保存修改，切换指标不会丢失草稿，是否继续？'))return;state.selected=code;state.references=[];render()}
function metric(){return state.draft.indicators.find(x=>x.code===state.selected)}function render(){renderMetricToolbar();renderMetricList();renderMetricDetail();$('saveState').textContent=state.dirty?'未保存修改':'已保存'}function renderMetricDetail(){const c=$('content');c.replaceChildren();if(state.tab==='raw')return renderRaw(c);if(!metric()){renderEmptyState(c);return}if(state.tab==='references')return renderMetricReferences(c);if(state.tab==='preview')return renderPreview(c);renderMetricForm(c)}
function renderMetricForm(c){const m=metric(),grid=el('div',undefined,'grid');const [fc,code]=field('指标编码（小写字母开头，2-64 位）',m.code),[fn,name]=field('指标名称',m.name),[fu,unit]=field('单位',m.unit),[ft,time]=field('数据更新时间（ISO-8601，不自动填充）',m.updatedAt),[fca,calc]=field('指标口径',m.calculation,'textarea');fca.classList.add('wide');[[code,'code'],[name,'name'],[unit,'unit'],[time,'updatedAt'],[calc,'calculation']].forEach(([i,k])=>i.addEventListener('input',()=>{if(k==='code'&&state.references.length)i.title='修改已引用编码会影响现有配置';m[k]=i.value;setDirty(true)}));grid.append(fc,fn,fu,ft,fca);if(m.unit==='%')grid.append(el('p','百分比指标：输入和 JSON 均使用原始小数（例如 0.55），展示为 55%。','status wide'));c.append(grid);renderMetricOrgData(c,m)}
function numberInput(value,onchange,percent){const wrap=el('div'),i=document.createElement('input');i.type='number';i.step='any';i.value=value;wrap.append(i);if(percent){const p=el('small',formatPercentagePreview(value),'muted');wrap.append(p);i.addEventListener('input',()=>p.textContent=formatPercentagePreview(i.value))}i.addEventListener('input',()=>onchange(i.value));return wrap}
function renderMetricOrgData(c,m){c.append(el('h3','机构数据'));const add=el('button','新增机构','ghost');add.addEventListener('click',()=>addMetricOrg(m));c.append(add);Object.entries(m.orgData||{}).forEach(([org,d])=>{const box=el('div',undefined,'org'),head=el('div');const code=document.createElement('input');code.value=org;const del=el('button','删除机构','danger');del.addEventListener('click',()=>deleteMetricOrg(m,org));code.addEventListener('change',()=>{const next=code.value.trim();if(!next||m.orgData[next]){message('机构编码不能为空且必须唯一',true);code.value=org;return}delete m.orgData[org];m.orgData[next]=d;setDirty(true);render()});head.append(el('b','机构编码 '),code,del);box.append(head,el('div','current（原始数值）','muted'),numberInput(d.current,v=>{d.current=toNumber(v);setDirty(true)},m.unit==='%'),el('div','previous（原始数值）','muted'),numberInput(d.previous,v=>{d.previous=toNumber(v);setDirty(true)},m.unit==='%'));renderMetricTrend(box,m,d);c.append(box)})}
function renderMetricTrend(box,m,d){box.append(el('h4','趋势数据（期间排序预览）'));const sorted=[...(d.trend||[])].map(x=>x.period).sort().join(' → ');box.append(el('div',sorted||'暂无趋势点','muted'));(d.trend||[]).forEach((p,index)=>{const row=el('div',undefined,'row'),period=document.createElement('input');period.value=p.period;period.placeholder='期间';period.addEventListener('input',()=>{p.period=period.value;setDirty(true)});row.append(period,numberInput(p.value,v=>{p.value=toNumber(v);setDirty(true)},m.unit==='%'));const del=el('button','删除','danger');del.addEventListener('click',()=>deleteTrendPoint(d,index));row.append(del);box.append(row)});const add=el('button','新增趋势点','ghost');add.addEventListener('click',()=>addTrendPoint(d));box.append(add)}
function toNumber(v){return v===''?null:Number(v)}function addMetric(){let code='new_metric',i=1;while(state.draft.indicators.some(x=>x.code===code))code='new_metric_'+i++;state.draft.indicators.push({code,name:'新指标',unit:'元',calculation:'请填写指标口径',updatedAt:'',orgData:{}});state.selected=code;setDirty(true);render()}function updateMetric(){setDirty(true)}function addMetricOrg(m){let k='ORG_CODE',i=1;while(m.orgData[k])k='ORG_CODE_'+i++;m.orgData[k]={current:0,previous:0,trend:[]};setDirty(true);render()}function deleteMetricOrg(m,k){if(confirm('确认删除机构 '+k+' 及其趋势数据？')){delete m.orgData[k];setDirty(true);render()}}function addTrendPoint(d){d.trend.push({period:'',value:0});setDirty(true);render()}function deleteTrendPoint(d,i){d.trend.splice(i,1);setDirty(true);render()}
async function deleteMetric(){const m=metric();if(!m||state.deleting)return;state.deleting=true;try{await loadMetricReferences();state.tab='references';render();const impacts=state.references.map(r=>r.source+' / '+r.type+' / '+r.match).join('\n')||'未发现严格引用；当前仅完成已知配置引用检查。';if(!confirm('第一次确认：删除指标 '+m.code+'（'+m.name+'）？\n'+impacts))return;if(!confirm('第二次确认：仅从浏览器草稿删除，保存配置后才正式生效。是否继续？'))return;state.draft.indicators=state.draft.indicators.filter(x=>x!==m);Object.values(state.draft.candidates||{}).forEach(a=>{if(Array.isArray(a)){let i;while((i=a.indexOf(m.code))>=0)a.splice(i,1)}});state.selected=state.draft.indicators[0]?.code||null;state.tab='structured';setDirty(true);message('已从草稿删除；尚未保存到正式配置。')}catch(e){renderHttpError(e)}finally{state.deleting=false}}
function serializeMetricDraft(){return JSON.stringify(state.draft,null,2)+'\n'}function syncStructuredDraftToRaw(){state.rawText=serializeMetricDraft()}function syncRawDraftToStructured(){try{const parsed=parseMetricConfig(state.rawText);state.draft=parsed;if(!metric())state.selected=parsed.indicators[0]?.code||null;setDirty(true);message('配置原文已解析并同步到结构化草稿。');return true}catch(e){message('原文解析失败，结构化草稿保持不变：'+e.message,true);return false}}
function renderRaw(c){const note=el('p','原文修改只有成功解析后才同步；失败原文会保留。','status'),raw=el('textarea',undefined,'raw');raw.value=state.rawText||serializeMetricDraft();raw.addEventListener('input',()=>{state.rawText=raw.value;setDirty(true)});const sync=el('button','解析并同步到结构化表单','primary');sync.addEventListener('click',()=>{if(syncRawDraftToStructured())render()});c.append(note,raw,sync)}function renderPreview(c){const m=metric();c.append(el('h3',m.name+' 数据预览'));Object.entries(m.orgData).forEach(([k,v])=>c.append(el('p',k+'：当前 '+formatMetricValue(v.current,m.unit)+'，上期 '+formatMetricValue(v.previous,m.unit)+'；趋势 '+v.trend.map(x=>x.period+' '+formatMetricValue(x.value,m.unit)).join(' / '))))}
async function loadMetricReferences(){const m=metric();if(!m)return;state.references=await request('/api/admin/assistant-config/metrics/'+encodeURIComponent(m.code)+'/references')}function renderMetricReferences(c){const b=el('button','执行引用检查','primary');b.addEventListener('click',async()=>{try{await loadMetricReferences();render()}catch(e){renderHttpError(e)}});c.append(el('p','当前仅完成已知配置引用检查；文本命中仅代表可能引用。','status'),b);if(!state.references.length)return;c.append(renderRefsTable())}function renderRefsTable(){const t=el('table',undefined,'refs'),h=el('tr');['来源配置','来源对象','引用类型','匹配内容','阻止删除','说明'].forEach(x=>h.append(el('th',x)));t.append(h);state.references.forEach(r=>{const tr=el('tr');[r.source,r.object,r.type,r.match,r.blocksDeletion?'是':'否',r.note].forEach(x=>tr.append(el('td',x)));t.append(tr)});return t}
function validateMetricForm(){return validateMetricConfig(state.draft)}function validateMetricConfig(d){const errors=[],codes=new Set(),re=/^[a-z][a-z0-9_]{1,63}$/;d.indicators.forEach((m,i)=>{const p='indicators['+i+']';if(!re.test(m.code||''))errors.push(p+'.code 格式不合法');if(codes.has(m.code))errors.push(p+'.code 重复');codes.add(m.code);['name','unit','calculation'].forEach(k=>{if(typeof m[k]!=='string'||!m[k].trim())errors.push(p+'.'+k+' 必填')});if(Number.isNaN(Date.parse(m.updatedAt)))errors.push(p+'.updatedAt 无效');Object.entries(m.orgData||{}).forEach(([o,v])=>{if(!o.trim())errors.push(p+'.orgData 机构编码为空');['current','previous'].forEach(k=>{if(typeof v[k]!=='number'||!Number.isFinite(v[k]))errors.push(p+'.orgData.'+o+'.'+k+' 必须为数值')});const periods=new Set();(v.trend||[]).forEach((x,j)=>{if(!x.period)errors.push(p+'.orgData.'+o+'.trend['+j+'].period 必填');if(periods.has(x.period))errors.push(p+'.orgData.'+o+'.trend['+j+'].period 重复');periods.add(x.period);if(typeof x.value!=='number'||!Number.isFinite(x.value))errors.push(p+'.orgData.'+o+'.trend['+j+'].value 必须为数值')})})});return errors}
async function validateDraft(){if(state.validating)return false;if(state.tab==='raw'&&!syncRawDraftToStructured())return false;const local=validateMetricForm();if(local.length){message(local.join('\n'),true);return false}state.validating=true;try{const result=await request('/api/admin/assistant-config/mock/validate',{method:'PUT',body:JSON.stringify({content:serializeMetricDraft()})});message('校验通过，共 '+state.draft.indicators.length+' 个指标。');return result.valid}catch(e){renderHttpError(e);return false}finally{state.validating=false}}
async function saveDraft(){if(state.saving)return;if(!await validateDraft())return;state.saving=true;$('save').disabled=true;try{const d=await request('/api/admin/assistant-config/mock',{method:'PUT',body:JSON.stringify({content:serializeMetricDraft(),checksum:state.checksum})});state.checksum=d.checksum;state.rawText=d.content;state.draft=parseMetricConfig(d.content);state.original=clone(state.draft);setDirty(false);message('配置保存成功，更新时间：'+d.updatedAt);render()}catch(e){renderHttpError(e)}finally{state.saving=false;$('save').disabled=false}}
function setDirty(v){state.dirty=v;$('saveState').textContent=v?'未保存修改':'已保存'}function discardChanges(){if(!state.dirty||confirm('恢复到本次加载时的配置并丢弃所有未保存修改？')){state.draft=clone(state.original);state.rawText=serializeMetricDraft();if(!metric())state.selected=state.draft.indicators[0]?.code||null;setDirty(false);render()}}function formatMetricValue(v,u){return u==='%'?formatPercentagePreview(v):String(v)+' '+u}function formatPercentagePreview(v){const n=Number(v);return Number.isFinite(n)?(n*100).toLocaleString('zh-CN',{maximumFractionDigits:4})+'%':'—'}function message(text,bad=false){const m=$('message');m.replaceChildren(el('div',text,'status'+(bad?' error':'')))}function renderLoading(){message('正在读取真实 deposit.json 配置…')}function renderEmptyState(c){c.append(el('p','暂无指标，请新增指标或清除搜索条件。','muted'))}function renderHttpError(e){if(e.name!=='AbortError')message(e.message||String(e),true)}
$('search').addEventListener('input',e=>{state.search=e.target.value;renderMetricList()});$('unit').addEventListener('change',e=>{state.unit=e.target.value;renderMetricList()});$('clear').addEventListener('click',()=>{state.search='';state.unit='';$('search').value='';render()});$('add').addEventListener('click',addMetric);$('reload').addEventListener('click',()=>loadMetricDraft());$('save').addEventListener('click',saveDraft);$('validate').addEventListener('click',validateDraft);$('discard').addEventListener('click',discardChanges);$('remove').addEventListener('click',deleteMetric);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{if(state.tab==='raw'&&b.dataset.tab!=='raw'&&!syncRawDraftToStructured())return;state.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(state.tab==='raw')syncStructuredDraftToRaw();renderMetricDetail()}));window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});loadMetricDraft(true);
</script></body></html>
