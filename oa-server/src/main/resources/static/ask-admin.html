<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能问数管理中心 · Smart OA</title>
<style>
:root{--navy:#071d38;--navy2:#0b315d;--blue:#176fc1;--pale:#eef5fb;--ink:#172b3e;--muted:#6b7d90;--line:#dbe5ee;--good:#087a55;--warn:#a56b00;--bad:#b63838;--shadow:0 8px 26px #071d3812}*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:70px;background:linear-gradient(110deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;padding:0 22px;gap:20px;position:sticky;top:0;z-index:10}.brand{font-weight:800;letter-spacing:.12em}.top h1{font-size:20px;margin:0;border-left:1px solid #ffffff3b;padding-left:20px}.top-meta{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}.pill,.status{border-radius:99px;padding:3px 9px;font-size:12px;background:#ffffff16;border:1px solid #ffffff28}.shell{display:grid;grid-template-columns:285px 1fr;min-height:calc(100vh - 70px)}aside{background:#092541;color:#d6e4f0;padding:17px 13px;overflow:auto}.nav-toggle{display:none}.group-title{color:#7895ae;font-size:11px;letter-spacing:.11em;padding:16px 10px 6px}.primary{width:100%;display:flex;align-items:center;gap:7px;border:0;color:#e6f0f8;background:transparent;padding:10px;border-radius:7px;text-align:left}.primary:hover,.primary.open{background:#ffffff0c}.chevron{margin-left:auto}.secondary{padding:3px 0 7px}.secondary button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:transparent;color:#a9c0d4;text-align:left;padding:8px 8px 8px 29px;border-radius:6px}.secondary button:hover,.secondary button.active{background:#176fc131;color:#fff}.secondary button:disabled{opacity:.42;cursor:not-allowed}.tag{margin-left:auto;border-radius:4px;font-size:10px;padding:1px 5px;white-space:nowrap}.available{background:#087a5530;color:#43d2a0}.partial{background:#bd7c1830;color:#f1bb61}.planned{background:#6c789130;color:#b9c3d3}.disabled{background:#9e3b3b30;color:#ee9999}main{padding:24px;min-width:0}.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:10px}.page-head,.card{background:#fff;border:1px solid #e1e8ef;border-radius:11px;box-shadow:var(--shadow)}.page-head{padding:19px 22px;margin-bottom:16px;display:flex;justify-content:space-between;gap:20px}.page-head h2{margin:0 0 4px;font-size:22px}.description{color:var(--muted)}.head-meta{text-align:right;white-space:nowrap}.content{display:grid;gap:16px}.card{padding:20px}.card h3{margin:0 0 14px;font-size:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.btn{border:1px solid #c9d7e4;background:#fff;color:#214666;padding:8px 13px;border-radius:7px}.btn.primary-btn{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--bad);border-color:#e9bcbc}.btn:disabled{opacity:.5;cursor:not-allowed}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-weight:650}.input,textarea,select{width:100%;border:1px solid #cbd8e4;border-radius:7px;padding:9px;background:#fff}textarea.editor{min-height:390px;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#f5f9fc;border:1px solid #e4edf4;border-radius:8px;padding:14px}.stat strong{font-size:23px;color:var(--navy2);display:block}.muted{color:var(--muted)}.notice{border-left:4px solid var(--blue);background:#edf6ff;padding:13px;border-radius:6px;white-space:pre-wrap}.notice.error{border-color:var(--bad);background:#fff1f1;color:#7f2525}.notice.warn{border-color:var(--warn);background:#fff8e9}.badge-status{display:inline-block;border-radius:99px;padding:3px 9px;color:#fff;font-size:12px}.badge-status.available{background:var(--good)}.badge-status.partial{background:var(--warn)}.badge-status.planned{background:#6c7891}.badge-status.disabled{background:#8d3030}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:650}.split{display:grid;grid-template-columns:280px 1fr;gap:16px}.list{max-height:520px;overflow:auto}.list button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;padding:10px}.list button:hover{background:var(--pale)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b2137;color:#d9e8f5;padding:14px;border-radius:7px;max-height:520px;overflow:auto}.loading{display:flex;gap:10px;align-items:center;color:var(--blue)}.spinner{width:17px;height:17px;border:2px solid #bdd7ee;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.empty{text-align:center;color:var(--muted);padding:40px}.mobile-shade{display:none}
@media(max-width:850px){.top{height:auto;min-height:64px;padding:12px}.top-meta{display:none}.nav-toggle{display:block;background:#ffffff18;color:#fff;border:1px solid #ffffff40;border-radius:6px;padding:6px}.shell{display:block}aside{position:fixed;z-index:20;left:-300px;top:64px;bottom:0;width:285px;transition:left .2s}.nav-open aside{left:0}.nav-open .mobile-shade{display:block;position:fixed;inset:64px 0 0;background:#0006;z-index:19}main{padding:14px}.page-head{display:block}.head-meta{text-align:left;margin-top:10px}.grid,.split{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><button id="navToggle" class="nav-toggle" aria-label="打开或关闭导航">☰</button><div class="brand">SMART OA</div><h1>智能问数管理中心</h1><div class="top-meta"><span class="pill">环境：<b id="environment">default</b></span><span class="pill">管理员：<b id="administrator">未登录</b></span><span class="pill">版本：<b id="runtimeVersion">—</b></span><span class="pill">后端：<b id="backendStatus">检测中</b></span><span class="pill">配置：<b id="loadStatus">—</b></span><span class="pill">未保存：<b id="dirtyStatus">无</b></span><span class="pill">待发布：<b id="publishStatus">无</b></span></div></header>
<div class="shell"><aside id="sidebar" aria-label="管理中心导航"><div id="menu"></div></aside><div id="shade" class="mobile-shade"></div><main><div id="breadcrumb" class="breadcrumb"></div><section id="pageHeader" class="page-head"></section><div id="content" class="content"></div></main></div>
<script>
'use strict';
const API='/api/admin/assistant-config';const STATUS={available:'可用',partial:'部分可用',planned:'规划中',disabled:'已停用'};const PAGE_TYPES=new Set(['dashboard','metric-definition','metric-preview','intent-definition','training-utterance','scenario-definition','scenario-simulation','skill-registry','output-template','policy-simulation','demo-user','mock-data','reference-validation','runtime-config','planned']);
const state={menu:null,current:null,config:null,dirty:false,busy:false,controllers:new Map(),traceId:null};const el=id=>document.getElementById(id);
function node(tag,text,className){const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(className)n.className=className;return n}function isObject(v){return v&&typeof v==='object'&&!Array.isArray(v)}function pretty(v){try{return JSON.stringify(v,null,2)}catch(e){return String(v)}}function clearContent(){el('content').replaceChildren()}function authHeaders(extra){const token=localStorage.getItem('oa_token');return Object.assign({Accept:'application/json'},token?{Authorization:'Bearer '+token}:{},extra||{})}
async function request(key,url,options){if(state.controllers.has(key))state.controllers.get(key).abort();const c=new AbortController();state.controllers.set(key,c);const opts=Object.assign({},options||{},{signal:c.signal,headers:authHeaders(options&&options.headers)});try{const response=await fetch(url,opts);const raw=await response.text();let data=null;if(raw){try{data=JSON.parse(raw)}catch(e){throw new Error('JSON 解析失败：'+e.message+'；原始响应：'+raw)}}if(!response.ok){const msg=response.status===401?'登录状态无效或已过期':response.status===403?'当前账号无权访问智能问数管理功能':response.status===409?'配置已被其他操作修改，请重新加载后再保存':response.status===500?'服务端错误：'+(data&&data.message||raw):data&&data.message||raw||('HTTP '+response.status);const error=new Error(msg);error.status=response.status;error.data=data;throw error}return{data,status:response.status}}catch(e){if(e.name==='AbortError')throw e;if(!e.status)e.message='网络失败：'+e.message;throw e}finally{if(state.controllers.get(key)===c)state.controllers.delete(key)}}
async function loadMenuConfig(){renderLoading('正在加载服务端菜单配置…');try{const r=await request('menu',API+'/menu');validateMenuConfig(r.data);state.menu=r.data;el('runtimeVersion').textContent=r.data.version;el('backendStatus').textContent='已连接';renderMenuGroups(r.data.groups);const first=findFirstPage(r.data.groups);if(first)navigateToPage(first.group,first.item,first.child)}catch(e){el('backendStatus').textContent='不可用';renderHttpError(e)}}
function validateMenuConfig(menu){if(!isObject(menu)||!Array.isArray(menu.groups)||!menu.version)throw new Error('菜单配置结构无效');const ids=[new Set(),new Set(),new Set()];for(const g of menu.groups){if(ids[0].has(g.id))throw new Error('菜单分组 ID 重复：'+g.id);ids[0].add(g.id);for(const i of g.items||[]){if(ids[1].has(i.id))throw new Error('一级菜单 ID 重复：'+i.id);ids[1].add(i.id);if(!STATUS[i.implementationStatus])throw new Error('菜单状态无效');for(const c of i.children||[]){if(ids[2].has(c.id))throw new Error('二级菜单 ID 重复：'+c.id);ids[2].add(c.id);if(!STATUS[c.implementationStatus]||!PAGE_TYPES.has(c.pageType))throw new Error('页面元数据无效：'+c.id)}}}return true}
function findFirstPage(groups){for(const g of groups)for(const i of g.items||[])for(const c of i.children||[])if(c.enabled&&c.implementationStatus!=='disabled')return{group:g,item:i,child:c};return null}
function renderMenuGroups(groups){const root=el('menu');root.replaceChildren();[...groups].sort((a,b)=>a.order-b.order).forEach(g=>{root.append(node('div',g.name,'group-title'));[...(g.items||[])].sort((a,b)=>a.order-b.order).filter(i=>i.enabled).forEach(i=>root.append(renderPrimaryMenu(g,i)))})}
function renderPrimaryMenu(group,item){const wrap=node('div');const b=node('button',undefined,'primary');b.type='button';b.append(node('span',item.name),renderImplementationStatus(item.implementationStatus,'tag'),node('span','⌄','chevron'));const children=renderSecondaryMenu(group,item);b.setAttribute('aria-expanded','true');b.addEventListener('click',()=>{const hidden=children.hidden;children.hidden=!hidden;b.classList.toggle('open',hidden);b.setAttribute('aria-expanded',String(hidden))});b.classList.add('open');wrap.append(b,children);return wrap}
function renderSecondaryMenu(group,item){const box=node('div',undefined,'secondary');(item.children||[]).filter(c=>c.enabled).forEach(child=>{const b=node('button');b.type='button';b.dataset.pageId=child.id;b.append(node('span',child.name),renderImplementationStatus(child.implementationStatus,'tag'));b.disabled=child.implementationStatus==='disabled';b.addEventListener('click',()=>navigateToPage(group,item,child));box.append(b)});return box}
async function navigateToPage(group,item,child){if(state.dirty&&!confirm('当前配置有未保存修改，确定离开并丢弃修改吗？'))return;resetEditorState();state.current={group,item,child};document.querySelectorAll('.secondary button').forEach(b=>b.classList.toggle('active',b.dataset.pageId===child.id));renderBreadcrumb(group,item,child);renderPageHeader(item,child);document.body.classList.remove('nav-open');const renderers={dashboard:renderDashboardPage,'metric-definition':renderMetricDefinitionPage,'metric-preview':renderMetricPreviewPage,'intent-definition':renderIntentDefinitionPage,'training-utterance':renderTrainingUtterancePage,'scenario-definition':renderScenarioDefinitionPage,'scenario-simulation':renderScenarioSimulationPage,'skill-registry':renderSkillRegistryPage,'output-template':renderOutputTemplatePage,'policy-simulation':renderPolicySimulationPage,'demo-user':renderDemoUserPage,'mock-data':renderMockDataPage,'reference-validation':renderReferenceValidationPage,'runtime-config':renderRuntimeConfigPage};try{await(renderers[child.pageType]||renderPlannedPage)(item,child)}catch(e){if(e.name!=='AbortError')renderHttpError(e)}}
function renderBreadcrumb(g,i,c){el('breadcrumb').textContent=g.name+' / '+i.name+' / '+c.name}function renderPageHeader(item,child){const h=el('pageHeader');h.replaceChildren();const left=node('div');left.append(node('h2',child.name),node('div',item.description,'description'));const right=node('div',undefined,'head-meta');right.append(renderImplementationStatus(child.implementationStatus,'badge-status'),node('div','菜单配置版本：'+state.menu.version,'muted'));h.append(left,right)}function renderImplementationStatus(status,klass){return node('span',STATUS[status]||status,klass+' '+status)}
function renderPlannedPage(item,child){clearContent();const card=node('section',undefined,'card');card.append(node('h3',child.name+' · '+STATUS[child.implementationStatus]));const target=node('div','功能目标：'+item.description,'notice warn');const list=node('ul');['完善领域模型与服务端权限校验','提供真实数据接口与错误处理','完成校验、审计和可回滚的变更流程'].forEach(x=>list.append(node('li',x)));card.append(target,node('h3','计划支持的功能点'),list,node('p','当前实现状态：'+STATUS[child.implementationStatus]),node('p','当前可使用的替代能力：'+alternative(child)),node('p','关联的现有配置或页面：'+child.capability));el('content').append(card)}function alternative(c){return c.capability==='none'?'暂无可替代的真实后端能力':'可使用 '+c.capability+' 对应的现有只读或部分能力'}
function renderLoading(message){clearContent();const box=node('div',undefined,'card loading');box.append(node('span',undefined,'spinner'),node('span',message));el('content').append(box)}function renderEmptyState(message){clearContent();el('content').append(node('div',message||'暂无数据','card empty'))}function renderHttpError(error){clearContent();const box=node('div',undefined,'card notice error');box.append(node('strong','请求失败'),node('div',error.message||String(error)));el('content').append(box)}
async function renderDashboardPage(){renderLoading('加载真实配置概览…');const [summary,list]=await Promise.all([request('summary',API+'/summary'),request('configs',API)]);clearContent();el('loadStatus').textContent=summary.data.loaded?'已加载':'未加载';const card=node('section',undefined,'card');card.append(node('h3','配置资产'));const grid=node('div',undefined,'grid');const c=summary.data.counts||{};[['指标',c.indicators],['意图',c.intents],['场景',c.scenarios],['Skill',c.skills],['模板',c.templates],['策略',c.policies],['演示用户',c.demoUsers],['演示机构',c.demoOrgs]].forEach(x=>{const s=node('div',undefined,'stat');s.append(node('strong',x[1]??'—'),node('span',x[0]));grid.append(s)});card.append(grid,node('p','最近加载：'+summary.data.lastLoadedAt,'muted'),node('p','最近保存：'+pretty(summary.data.lastSave),'muted'));el('content').append(card,tableCard('配置文件状态',list.data,['configKey','checksum','updatedAt']))}
async function loadConfig(key){renderLoading('正在加载真实配置…');const r=await request('config',API+'/'+key);state.config=r.data;return r.data}function collectDraft(){const editor=el('configEditor');return editor?editor.value:''}async function validateDraft(){if(!state.config)return false;const r=await request('validate',API+'/'+state.config.configKey+'/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:collectDraft()})});showMessage(r.data.valid?'校验通过':'校验失败：'+(r.data.errors||[]).join('；'),r.data.valid?'':'error');return r.data.valid}async function saveDraft(){if(state.busy||!state.config)return;if(!await validateDraft())return;state.busy=true;try{const r=await request('save',API+'/'+state.config.configKey,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:collectDraft(),checksum:state.config.checksum})});state.config=r.data;setDirty(false);showMessage('配置已通过校验并保存，checksum 已更新')}finally{state.busy=false}}function setDirty(value){state.dirty=value;el('dirtyStatus').textContent=value?'有':'无';el('publishStatus').textContent=value?'有未发布修改':'无'}function discardChanges(){if(!state.config)return;const editor=el('configEditor');if(editor)editor.value=state.config.content;setDirty(false)}function resetEditorState(){state.controllers.forEach(c=>c.abort());state.controllers.clear();state.config=null;state.traceId=null;setDirty(false)}
function renderRawEditor(title,data){clearContent();const card=node('section',undefined,'card');card.append(node('h3',title));const actions=node('div',undefined,'actions');const validate=node('button','校验','btn');const save=node('button','保存','btn primary-btn');const discard=node('button','恢复未保存修改','btn');validate.addEventListener('click',()=>validateDraft().catch(renderHttpError));save.addEventListener('click',()=>saveDraft().catch(renderHttpError));discard.addEventListener('click',discardChanges);actions.append(validate,save,discard);const area=node('textarea',undefined,'editor');area.id='configEditor';area.value=data.content;area.setAttribute('aria-label',title+'配置原文');area.addEventListener('input',()=>setDirty(area.value!==state.config.content));card.append(actions,area,node('p','checksum：'+data.checksum,'muted'));el('content').append(card)}
async function configPage(key,title){const data=await loadConfig(key);renderRawEditor(title,data)}async function renderMetricDefinitionPage(){await configPage('mock','指标定义与 Mock 数据配置原文')}async function renderIntentDefinitionPage(){await configPage('intents','意图定义配置')}async function renderTrainingUtterancePage(){await configPage('intents','训练问法（examples 与 keywords）')}async function renderScenarioDefinitionPage(){await configPage('scenarios','场景定义配置')}async function renderSkillRegistryPage(){await configPage('skills','Skill 注册配置')}async function renderOutputTemplatePage(){await configPage('templates','结果模板配置（仅以纯文本展示）')}async function renderMockDataPage(){await configPage('mock','Mock 指标数据');const reset=node('button','重置运行中 Mock 数据','btn danger');reset.addEventListener('click',async()=>{if(!confirm('第一次确认：确定重置运行中的 Mock 数据吗？')||!confirm('第二次确认：此操作不会伪造结果，确定继续吗？'))return;try{await request('mock-reset','/api/assistant/mock/reset',{method:'POST'});showMessage('后端已确认运行中 Mock 数据重置成功')}catch(e){showMessage(e.message,'error')}});const actions=el('content').querySelector('.actions');if(actions)actions.append(reset)}async function renderDemoUserPage(){await configPage('mock','演示用户与机构')}
async function renderMetricPreviewPage(){const data=await loadConfig('mock');let parsed;try{parsed=JSON.parse(data.content)}catch(e){throw new Error('Mock 配置 JSON 无效：'+e.message)}clearContent();const card=node('section',undefined,'card');card.append(node('h3','真实指标数据预览'));const iSel=node('select',undefined,'input'),oSel=node('select',undefined,'input'),out=node('div');(parsed.indicators||[]).forEach(i=>{const o=node('option',i.name);o.value=i.code;iSel.append(o)});function orgs(){oSel.replaceChildren();const metric=(parsed.indicators||[]).find(i=>i.code===iSel.value);Object.keys(metric&&metric.orgData||{}).forEach(k=>{const o=node('option',k);o.value=k;oSel.append(o)});preview()}function format(v,unit){return unit==='%'&&typeof v==='number'?new Intl.NumberFormat('zh-CN',{style:'percent',maximumFractionDigits:2}).format(v):String(v??'—')}function preview(){out.replaceChildren();const m=(parsed.indicators||[]).find(i=>i.code===iSel.value),v=m&&m.orgData[oSel.value];if(!m||!v){out.append(node('div','暂无真实配置数据','empty'));return}const grid=node('div',undefined,'grid');[['current',format(v.current,m.unit)],['previous',format(v.previous,m.unit)],['unit',m.unit],['updatedAt',m.updatedAt],['trend',pretty(v.trend)]].forEach(x=>{const s=node('div',undefined,'stat');s.append(node('strong',x[1]),node('span',x[0]));grid.append(s)});out.append(grid)}iSel.addEventListener('change',orgs);oSel.addEventListener('change',preview);card.append(field('指标',iSel),field('机构',oSel),out);el('content').append(card);orgs()}
async function renderPolicySimulationPage(){const [p,m]=await Promise.all([loadConfig('policies'),request('mock-policy',API+'/mock')]);state.config=p;let users=[];try{users=JSON.parse(m.data.content).users||[]}catch(e){throw new Error('Mock 配置解析失败')}clearContent();const card=node('section',undefined,'card');card.append(node('h3','策略模拟（演示，不改变正式权限）'));const user=node('select'),org=node('input');org.className='input';org.value='HEADQUARTERS';users.forEach(u=>{const o=node('option',u.name+' ('+u.id+')');o.value=u.id;user.append(o)});const result=node('div');const run=node('button','模拟策略','btn primary-btn');run.addEventListener('click',()=>{const u=users.find(x=>x.id===user.value);const allowed=!!u&&u.org===org.value;result.replaceChildren(node('div',(allowed?'允许':'拒绝')+'；匹配规则：allow_if_org_in_list；用户机构：'+(u&&u.org),'notice '+(allowed?'':'error')))});card.append(field('演示用户',user),field('目标机构',org),run,result);el('content').append(card)}
async function renderScenarioSimulationPage(){clearContent();const card=node('section',undefined,'card');card.append(node('h3','真实场景模拟'));const q=node('textarea');q.className='input';q.value='总部存款余额是多少';q.setAttribute('aria-label','模拟问法');const user=node('select');['demo_leader','demo_branch_manager'].forEach(x=>{const o=node('option',x);o.value=x;user.append(o)});const run=node('button','调用真实执行接口','btn primary-btn'),trace=node('button','手动加载 Trace','btn');trace.disabled=true;const out=node('pre','尚未执行');run.addEventListener('click',()=>runScenario(q.value,user.value,out,run,trace));trace.addEventListener('click',()=>loadTrace(out,trace));card.append(field('问法',q),field('演示用户',user),node('div',undefined,'actions'),out);card.querySelector('.actions').append(run,trace);el('content').append(card)}
async function runScenario(text,userId,out,run,trace){if(state.busy)return;state.busy=true;run.disabled=true;const started=performance.now();try{const r=await request('execute','/api/assistant/execute',{method:'POST',headers:{'Content-Type':'application/json','X-User-Id':userId},body:JSON.stringify({text:text,org:userId==='demo_leader'?'HEADQUARTERS':'BRANCH_001'})});state.traceId=r.data.traceId||null;trace.disabled=!state.traceId;out.textContent=pretty({httpStatus:r.status,durationMs:Math.round(performance.now()-started),intent:r.data.intent,scenario:r.data.scenario,slots:r.data.slots,matchedRules:r.data.matchedRules,template:r.data.template,result:r.data.result,candidates:r.data.candidates,suggestions:r.data.suggestions,error:r.data.error,traceId:r.data.traceId})}catch(e){out.textContent='真实请求失败：'+e.message}finally{state.busy=false;run.disabled=false}}
async function loadTrace(out,button){if(!state.traceId)return;button.disabled=true;try{const r=await request('trace','/api/assistant/trace/'+encodeURIComponent(state.traceId));out.textContent+='\n\n手动加载 Trace（HTTP '+r.status+'）：\n'+pretty(r.data)}catch(e){out.textContent+='\n\nTrace 加载失败：'+e.message}finally{button.disabled=false}}
async function loadReferences(){return(await request('references',API+'/references')).data}async function renderReferenceValidationPage(){renderLoading('加载真实引用关系…');const data=await loadReferences();clearContent();el('content').append(tableCard('场景引用',data.references||[],['scenario','type','target','valid']),noticeCard(data.valid?'全量关联有效':'发现丢失引用：'+(data.missing||[]).join('；'),data.valid?'':'error'))}async function renderRuntimeConfigPage(){renderLoading('加载真实配置状态…');const r=await request('summary',API+'/summary');clearContent();el('loadStatus').textContent=r.data.loaded?'已加载':'未加载';el('content').append(noticeCard('loaded：'+r.data.loaded+'\nlastLoadedAt：'+r.data.lastLoadedAt+'\nlastSave：'+pretty(r.data.lastSave)),tableCard('各配置状态',r.data.configs||[],['configKey','checksum','updatedAt']))}
function field(labelText,control){const f=node('div',undefined,'field');f.append(node('label',labelText),control);return f}function tableCard(title,rows,columns){const card=node('section',undefined,'card');card.append(node('h3',title));if(!Array.isArray(rows)||!rows.length){card.append(node('div','暂无数据','empty'));return card}const table=node('table'),thead=node('thead'),tr=node('tr');columns.forEach(c=>tr.append(node('th',c)));thead.append(tr);const tbody=node('tbody');rows.forEach(r=>{const row=node('tr');columns.forEach(c=>row.append(node('td',isObject(r[c])||Array.isArray(r[c])?pretty(r[c]):r[c])));tbody.append(row)});table.append(thead,tbody);card.append(table);return card}function noticeCard(message,type){const c=node('section',undefined,'card');c.append(node('div',message,'notice '+(type||'')));return c}function showMessage(message,type){const c=noticeCard(message,type);el('content').prepend(c)}
el('navToggle').addEventListener('click',()=>document.body.classList.toggle('nav-open'));el('shade').addEventListener('click',()=>document.body.classList.remove('nav-open'));window.addEventListener('beforeunload',e=>{state.controllers.forEach(c=>c.abort());if(state.dirty){e.preventDefault();e.returnValue=''}});let adminName='未登录';try{const profile=JSON.parse(localStorage.getItem('oa_demo_user')||'null');if(profile&&profile.displayName)adminName=profile.displayName}catch(e){}el('administrator').textContent=adminName;loadMenuConfig();
</script></body></html>
