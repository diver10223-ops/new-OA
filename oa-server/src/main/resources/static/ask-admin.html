<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart OA · 智能问数管理台</title>
  <style>
    :root{--nav:#071a36;--nav2:#102b52;--blue:#216bf3;--bg:#f2f5fa;--line:#dce3ed;--text:#17233d;--muted:#67758d;--ok:#16875b;--bad:#c0392b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}.top{height:66px;background:var(--nav);color:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:3}.brand{font-size:20px;font-weight:750}.brand small{font-size:14px;color:#9fb6d6;margin-left:14px}.statusbar{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}.pill{background:#16355d;border:1px solid #294b75;border-radius:20px;padding:5px 10px}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 66px)}nav{background:var(--nav2);padding:18px 12px}nav button{display:block;width:100%;border:0;background:transparent;color:#c9d6e7;text-align:left;padding:11px 16px;border-radius:7px;margin:2px 0;cursor:pointer}nav button:hover,nav button.active{background:#216bf3;color:#fff}.main{padding:24px;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.heading h1{font-size:22px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px;box-shadow:0 1px 3px #12233a0d}.metric b{display:block;font-size:28px;margin-top:7px}.muted{color:var(--muted)}.panel{margin-top:16px}.tabs{display:flex;border-bottom:1px solid var(--line);margin:-4px 0 14px}.tabs button{border:0;background:none;padding:10px 16px;cursor:pointer}.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue)}textarea{width:100%;min-height:430px;border:1px solid var(--line);border-radius:6px;padding:12px;font:13px/1.55 ui-monospace,monospace;resize:vertical}input,select{border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto auto;gap:8px;margin-bottom:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px;vertical-align:top}th{color:var(--muted);font-weight:600}.error{color:var(--bad)}.success{color:var(--ok)}pre{white-space:pre-wrap;word-break:break-word;background:#f7f9fc;border:1px solid var(--line);padding:12px;border-radius:6px;max-height:460px;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:grid;gap:5px}.full{grid-column:1/-1}.hidden{display:none!important}.dirty{color:#ffc857}@media(max-width:760px){.top{height:auto;min-height:66px;padding:12px}.statusbar{display:none}.shell{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:7px;position:sticky;top:66px;z-index:2}nav button{min-width:max-content}.main{padding:14px}.formgrid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.brand small{display:block;margin-left:0}.heading{align-items:flex-start}}
  </style>
</head>
<body>
<header class="top"><div class="brand">Smart OA <small>智能问数管理台</small></div><div class="statusbar"><span class="pill">环境：本地演示</span><span class="pill" id="adminName">管理员：admin</span><span class="pill" id="backendState">后端：连接中</span><span class="pill" id="loadState">配置：加载中</span><span class="pill" id="dirtyState">未保存：否</span></div></header>
<div class="shell"><nav id="navigation"></nav><main class="main"><div id="content"></div></main></div>
<script>
"use strict";
const menu=[['dashboard','运营概览'],['deposit','指标管理'],['intents','意图管理'],['scenarios','场景管理'],['skills','Skill 管理'],['templates','模板管理'],['policies','权限策略'],['users','演示用户与机构'],['demo','演示数据'],['references','引用关系'],['simulation','场景模拟']];
const state={page:'dashboard',configs:[],current:null,data:null,originalData:null,content:'',checksum:'',dirty:false,busy:false,tab:'structured',references:null,controllers:new Map()};
const el=id=>document.getElementById(id), node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function token(){return sessionStorage.getItem('token')||''}
async function api(url,options={}){const old=state.controllers.get(url);if(old)old.abort();const controller=new AbortController();state.controllers.set(url,controller);const headers=new Headers(options.headers||{});headers.set('Accept','application/json');if(options.body)headers.set('Content-Type','application/json');if(token())headers.set('Authorization','Bearer '+token());try{const response=await fetch(url,{...options,headers,signal:controller.signal});let body=null;const raw=await response.text();if(raw){try{body=JSON.parse(raw)}catch(e){throw new Error('响应 JSON 解析失败：'+e.message+'；原始响应：'+raw.slice(0,240))}}if(!response.ok){const message=body?.message||body?.error?.message||body?.data?.message||raw||response.statusText;const err=new Error('HTTP '+response.status+'：'+message);err.status=response.status;err.body=body;throw err}return body}catch(e){if(e.name==='AbortError')throw e;e.message=e.message||'网络请求失败';throw e}finally{if(state.controllers.get(url)===controller)state.controllers.delete(url)}}
function clear(root=el('content')){while(root.firstChild)root.removeChild(root.firstChild)}
function renderNavigation(){const nav=el('navigation');clear(nav);menu.forEach(([key,label])=>{const b=node('button',label,key===state.page?'active':'');b.addEventListener('click',()=>navigate(key));nav.appendChild(b)})}
async function navigate(page){if(state.dirty&&!confirm('当前配置尚未保存，是否放弃修改？'))return;if(state.dirty)discardChanges();state.page=page;renderNavigation();if(page==='dashboard')return loadDashboard();if(page==='references')return loadReferences();if(page==='simulation')return renderSimulation();const key=['users','demo'].includes(page)?'deposit':page;await loadConfig(key);renderCurrentPage()}
function heading(title,actions=[]){const wrap=node('div',undefined,'heading'),h=node('h1',title),a=node('div',undefined,'actions');actions.forEach(x=>a.appendChild(x));wrap.append(h,a);return wrap}
function button(text,fn,cls='btn'){const b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b}
async function loadConfigList(){const data=await api('/api/admin/assistant-config');state.configs=data.configs||[];return state.configs}
async function loadDashboard(){clear();el('content').appendChild(heading('运营概览'));try{const [summary]=await Promise.all([api('/api/admin/assistant-config/summary'),loadConfigList()]);el('backendState').textContent='后端：已连接';el('loadState').textContent='配置：'+(summary.loaded?'已加载':'异常');renderDashboard(summary)}catch(e){el('backendState').textContent='后端：连接失败';renderHttpError(e)}}
function renderDashboard(summary){const root=el('content'),cards=node('div',undefined,'cards');const labels={intents:'意图',scenarios:'场景',skills:'Skill',templates:'模板',policies:'策略',deposit:'指标',users:'演示用户',organizations:'演示机构'};Object.entries(labels).forEach(([k,label])=>{const c=node('div',undefined,'card metric');c.append(node('span',label,'muted'),node('b',String(summary.counts?.[k]??0)));cards.appendChild(c)});root.appendChild(cards);const p=node('section',undefined,'panel');p.append(node('h2','运行状态'),node('p','配置加载状态：'+(summary.loaded?'正常':'异常')),node('p','最近加载：'+(summary.lastLoadedAt||'-')),node('p','最近保存：'+JSON.stringify(summary.lastSave||{})));root.appendChild(p)}
async function loadConfig(key){setLoading(true);try{const result=await api('/api/admin/assistant-config/'+encodeURIComponent(key));state.current=key;state.data=structuredClone(result.data);state.originalData=structuredClone(result.data);state.content=result.content;state.checksum=result.checksum;state.tab='structured';setDirty(false)}catch(e){clear();renderHttpError(e)}finally{setLoading(false)}}
function renderCurrentPage(){if(state.page==='deposit')renderIndicatorEditor();else if(state.page==='intents')renderIntentEditor();else if(state.page==='scenarios')renderScenarioEditor();else if(state.page==='skills')renderSkillEditor();else if(state.page==='templates')renderTemplateEditor();else if(state.page==='policies')renderPolicyEditor();else if(state.page==='users')renderUsers();else renderDemoDataEditor()}
function editorTitle(){return menu.find(x=>x[0]===state.page)?.[1]||state.page}
function renderGeneric(top,idField,fields){clear();const root=el('content');const validate=button('校验',validateDraft),save=button('保存',saveDraft,'btn primary');root.appendChild(heading(editorTitle(),[validate,save]));const panel=node('section',undefined,'panel'),tabs=node('div',undefined,'tabs'),structured=button('结构化编辑',()=>{state.tab='structured';renderCurrentPage()},'active'),raw=button('配置原文',()=>{state.tab='raw';renderCurrentPage()});if(state.tab==='raw'){structured.className='';raw.className='active'}tabs.append(structured,raw);panel.appendChild(tabs);if(state.tab==='raw'){const area=node('textarea');area.value=state.content;area.setAttribute('aria-label','配置原文');area.addEventListener('input',()=>{state.content=area.value;setDirty(true)});panel.appendChild(area)}else{const tools=node('div',undefined,'toolbar'),search=node('input');search.placeholder='搜索 ID 或名称';const add=button('新增条目',()=>addItem(top,idField,fields));tools.append(search,add);panel.appendChild(tools);const host=node('div',undefined,'tablewrap');panel.appendChild(host);const draw=()=>drawTable(host,top,idField,fields,search.value);search.addEventListener('input',draw);draw()}root.appendChild(panel);const validation=node('section',undefined,'panel');validation.id='validation';root.appendChild(validation)}
function drawTable(host,top,idField,fields,query){clear(host);const table=node('table'),thead=node('thead'),hr=node('tr');[...fields,'操作'].forEach(x=>hr.appendChild(node('th',x)));thead.appendChild(hr);const body=node('tbody');(state.data[top]||[]).filter(x=>JSON.stringify(x).toLowerCase().includes((query||'').toLowerCase())).forEach(item=>{const tr=node('tr');fields.forEach(f=>{const value=item[f];tr.appendChild(node('td',Array.isArray(value)?value.join(', '):(value&&typeof value==='object'?JSON.stringify(value):String(value??''))))});const td=node('td');td.append(button('编辑',()=>editItem(item,top,idField), 'btn'),button('删除',()=>deleteItem(item,top,idField),'btn danger'));tr.appendChild(td);body.appendChild(tr)});table.append(thead,body);host.appendChild(table)}
function editItem(item,top,idField){const text=prompt('编辑条目 JSON',JSON.stringify(item,null,2));if(text===null)return;try{const value=JSON.parse(text);Object.keys(item).forEach(k=>delete item[k]);Object.assign(item,value);setDirty(true);renderCurrentPage()}catch(e){alert('JSON 无效：'+e.message)}}
function addItem(top,idField,fields){const value={};fields.forEach(f=>value[f]=f===idField?'new_'+Date.now():'');state.data[top].push(value);setDirty(true);editItem(value,top,idField)}
async function deleteItem(item,top,idField){try{const refs=state.references||await api('/api/admin/assistant-config/references');state.references=refs;const id=String(item[idField]);const used=(refs.edges||[]).filter(e=>e.to===id);if(used.length){alert('无法删除，存在场景引用：'+used.map(e=>e.from).join(', '));return}if(confirm('确认删除 '+id+'？')){state.data[top]=state.data[top].filter(x=>x!==item);setDirty(true);renderCurrentPage()}}catch(e){renderHttpError(e)}}
function renderIndicatorEditor(){renderGeneric('indicators','code',['code','name','unit','calculation','updatedAt','orgData'])}function renderIntentEditor(){renderGeneric('intents','id',['id','name','examples','keywords'])}function renderScenarioEditor(){renderGeneric('scenarios','id',['id','name','intent','slots','domainType','mode','skills','template','policies'])}function renderSkillEditor(){renderGeneric('skills','id',['id','name','type','description','requiresConfirmation'])}function renderTemplateEditor(){renderGeneric('templates','id',['id','title','view'])}function renderPolicyEditor(){renderGeneric('policies','id',['id','name','description','rules'])}
function renderUsers(){renderGeneric('users','id',['id','name','roles','org'])}function renderDemoDataEditor(){renderGeneric('indicators','code',['code','name','orgData']);const actions=document.querySelector('.heading .actions');if(actions)actions.prepend(button('Mock reset',resetMock,'btn danger'))}
function collectDraft(){if(state.tab==='raw')return state.content;state.content=state.current==='deposit'?JSON.stringify(state.data,null,2):toYaml(state.data);return state.content}
function toYaml(value,depth=0){const pad='  '.repeat(depth);if(Array.isArray(value))return value.map(v=>typeof v==='object'&&v!==null?pad+'- '+toYaml(v,depth+1).trimStart():pad+'- '+scalar(v)).join('\n')+'\n';if(value&&typeof value==='object')return Object.entries(value).map(([k,v])=>{if(typeof v==='object'&&v!==null)return pad+k+':\n'+toYaml(v,depth+1);if(typeof v==='string'&&v.includes('\n'))return pad+k+': |\n'+v.split('\n').map(line=>'  '+pad+line).join('\n')+'\n';return pad+k+': '+scalar(v)+'\n'}).join('');return scalar(value)}
function scalar(v){if(v===null)return 'null';if(typeof v==='string')return JSON.stringify(v);return String(v)}
async function validateDraft(){if(state.busy)return;setBusy(true);try{const result=await api('/api/admin/assistant-config/'+state.current+'/validate',{method:'POST',body:JSON.stringify({content:collectDraft()})});renderValidation(result);return result}catch(e){renderHttpError(e)}finally{setBusy(false)}}
function renderValidation(result){let host=el('validation');if(!host){host=node('section',undefined,'panel');host.id='validation';el('content').appendChild(host)}clear(host);host.appendChild(node('h2',result.valid?'校验通过':'校验失败',result.valid?'success':'error'));(result.errors||[]).forEach(x=>host.appendChild(node('p',`${x.config} / ${x.entryId||'-'} / ${x.field}：${x.message}`,'error')));(result.warnings||[]).forEach(x=>host.appendChild(node('p',String(x),'muted')))}
async function saveDraft(){if(state.busy)return;const validation=await validateDraft();if(!validation?.valid)return;const note=prompt('请输入变更说明');if(!note)return;if(!confirm('校验已通过，确认保存并重新加载运行时配置？'))return;setBusy(true);try{const result=await api('/api/admin/assistant-config/'+state.current,{method:'PUT',body:JSON.stringify({content:collectDraft(),expectedChecksum:state.checksum,changeNote:note})});state.checksum=result.checksum;state.originalData=structuredClone(state.data);setDirty(false);alert('保存成功，运行时配置已重新加载')}catch(e){renderHttpError(e)}finally{setBusy(false)}}
async function loadReferences(){clear();el('content').appendChild(heading('引用关系'));try{state.references=await api('/api/admin/assistant-config/references');renderReferences(state.references)}catch(e){renderHttpError(e)}}
function renderReferences(refs){const panel=node('section',undefined,'panel');panel.appendChild(node('p','意图 → 场景 → Skill / 模板 / 权限策略','muted'));const table=node('table'),body=node('tbody');(refs.edges||[]).forEach(e=>{const tr=node('tr');tr.append(node('td',e.fromType+'：'+e.from),node('td','→'),node('td',e.toType+'：'+e.to));body.appendChild(tr)});table.appendChild(body);panel.appendChild(table);el('content').appendChild(panel)}
function renderSimulation(){clear();const root=el('content');root.appendChild(heading('场景模拟'));const p=node('section',undefined,'panel formgrid'),q=node('input'),user=node('select'),org=node('input'),run=button('执行真实问数',runScenario,'btn primary');q.placeholder='例如：本月本分行存款余额是多少';[['demo_leader','行长'],['demo_branch_manager','分行经理']].forEach(([v,t])=>{const o=node('option',t);o.value=v;user.appendChild(o)});org.value='BRANCH_001';[['问题',q],['演示用户',user],['目标机构',org]].forEach(([t,c])=>{const l=node('label');l.append(node('span',t),c);p.appendChild(l)});p.appendChild(run);root.appendChild(p);const out=node('section',undefined,'panel');out.id='simulationResult';root.appendChild(out);state.sim={q,user,org,run}}
async function runScenario(){if(state.busy)return;setBusy(true);const start=performance.now();try{const response=await api('/api/assistant/execute',{method:'POST',headers:{'X-User-Id':state.sim.user.value},body:JSON.stringify({text:state.sim.q.value,org:state.sim.org.value})});const elapsed=Math.round(performance.now()-start),host=el('simulationResult');clear(host);host.append(node('h2','响应（HTTP 200，'+elapsed+' ms）'),node('pre',JSON.stringify(response,null,2)));if(response.traceId){const b=button('手动加载 Trace',()=>loadTrace(response.traceId));host.appendChild(b)}}catch(e){renderHttpError(e)}finally{setBusy(false)}}
async function resetMock(){if(!confirm('这将重置运行时 Mock 数据，是否继续？'))return;if(!confirm('二次确认：确定执行 Mock reset？'))return;setBusy(true);try{await api('/api/assistant/mock/reset',{method:'POST'});alert('运行时 Mock 数据已重置')}catch(e){renderHttpError(e)}finally{setBusy(false)}}
async function loadTrace(traceId){try{const trace=await api('/api/assistant/trace/'+encodeURIComponent(traceId));el('simulationResult').append(node('h3','执行 Trace'),node('pre',JSON.stringify(trace,null,2)))}catch(e){renderHttpError(e)}}
function setDirty(value){state.dirty=value;el('dirtyState').textContent='未保存：'+(value?'是':'否');el('dirtyState').classList.toggle('dirty',value)}function discardChanges(){state.data=structuredClone(state.originalData);state.dirty=false;setDirty(false)}function resetEditorState(){state.current=null;state.data=null;state.content='';state.checksum='';setDirty(false)}function setBusy(v){state.busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v)}function setLoading(v){el('loadState').textContent='配置：'+(v?'加载中':'已加载')}
function renderHttpError(error){let host=el('content');const box=node('section',undefined,'panel error');box.append(node('strong','请求失败'),node('p',error.message||String(error)));host.appendChild(box)}
window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});renderNavigation();loadDashboard();
</script>
</body></html>
